services:
  postgres:
    image: postgres:18-alpine
    container_name: booking-hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_hotel
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_hotel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
